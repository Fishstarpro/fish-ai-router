spring:
  application:
    name: fish-ai-router
  profiles:
    active: local
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_ai_router?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password:
  # Session 配置
  session:
    store-type: redis
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  # spring-ai
#  ai:
#    openai:
#      # 通义千问兼容 OpenAI 接口
#      base-url: https://dashscope.aliyuncs.com/compatible-mode
#      api-key:
#      chat:
#        options:
#          model: qwen-plus
#          temperature: 0.7
server:
  port: 8123
  servlet:
    context-path: /api
# MyBatis Flex 配置
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# AI 网关配置
ai:
  cache:
    # 是否启用响应缓存
    enabled: true
    # 缓存过期时间（秒），默认1小时
    ttl: 3600
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yxc.airouter.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

stripe:
  api-key: sk_test_YOUR_TEST_KEY  # 替换为你的测试密钥
  webhook-secret: whsec_YOUR_WEBHOOK_SECRET  # Webhook 签名密钥
  success-url: http://localhost:5173/recharge/success
  cancel-url: http://localhost:5173/recharge/cancel

plugin:
  serpapi:
    api-key: